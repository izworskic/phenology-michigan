name: Bloom Summer Render QA

on:
  push:
    branches:
      - expand/bloom-summer-high-signal

jobs:
  render-summer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start preview server
        run: |
          VERCEL_ENV=preview npm start -- -p 3000 > /tmp/bloom-summer.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS 'http://127.0.0.1:3000/bloom-tracker?fixture=summer' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bloom-summer.log
          exit 1
      - name: Verify nine-display mobile render
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, hasTouch: true, isMobile: true });
          const errors = [];
          page.on('console', (msg) => { if (msg.type() === 'error') errors.push(msg.text()); });
          await page.goto('http://127.0.0.1:3000/bloom-tracker?fixture=summer', { waitUntil: 'networkidle', timeout: 60000 });
          await page.waitForFunction(() => document.querySelectorAll('.bloom-map-marker').length === 9, null, { timeout: 15000 });
          await page.waitForFunction(() => document.querySelectorAll('.bloom-carto-map .leaflet-tile-loaded').length >= 4, null, { timeout: 15000 });
          await page.locator('.map-section').scrollIntoViewIfNeeded();
          await page.waitForTimeout(700);
          const report = await page.evaluate(() => {
            const allTooltips = [...document.querySelectorAll('.bloom-map-tooltip')];
            const tooltips = allTooltips.filter((node) => getComputedStyle(node).visibility !== 'hidden').map((node) => {
              const r = node.getBoundingClientRect();
              return { text: node.textContent.trim(), left: r.left, top: r.top, right: r.right, bottom: r.bottom, width: r.width, height: r.height };
            });
            const overlaps = [];
            for (let i = 0; i < tooltips.length; i += 1) for (let j = i + 1; j < tooltips.length; j += 1) {
              const a = tooltips[i], b = tooltips[j];
              if (a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top) overlaps.push([a.text, b.text]);
            }
            const body = document.body.getBoundingClientRect();
            return {
              markerCount: document.querySelectorAll('.bloom-map-marker').length,
              cardCount: document.querySelectorAll('.opportunity-card').length,
              tooltipCount: allTooltips.length,
              visibleTooltipCount: tooltips.length,
              overlaps,
              overflow: Math.max(0, body.width - innerWidth, document.documentElement.scrollWidth - innerWidth),
              insight: document.querySelector('.bloom-map-insight-copy')?.textContent?.trim() || '',
              labels: tooltips.map((item) => item.text),
            };
          });
          if (report.markerCount !== 9 || report.cardCount !== 9) throw new Error(`Expected nine markers/cards: ${JSON.stringify(report)}`);
          if (report.overlaps.length) throw new Error(`Visible map labels collide: ${JSON.stringify(report.overlaps)}`);
          if (report.visibleTooltipCount < 4) throw new Error(`Declutter hid too much context: ${JSON.stringify(report)}`);
          if (report.overflow > 2) throw new Error(`Mobile overflow: ${report.overflow}`);
          if (errors.length) throw new Error(`Console errors: ${errors.join(' | ')}`);
          await page.screenshot({ path: '/tmp/bloom-summer-mobile.png', fullPage: true });
          await fs.writeFile('/tmp/bloom-summer-report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-summer-mobile-render
          path: |
            /tmp/bloom-summer-mobile.png
            /tmp/bloom-summer-report.json
          retention-days: 3
