name: Update hummingbird arrival history
on:
  schedule:
    # After the spring reporting window closes each year; UTC.
    - cron: '15 11 1 7 *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hummingbird-history-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Download newly completed spring seasons
        run: node scripts/refresh-hummingbird-history.mjs
      - name: Validate archive and pages
        run: npm test && npm run build
      - name: Commit new archive only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hummingbird-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh historical Michigan hummingbird reporting archive"
            git push origin HEAD:main
          fi
