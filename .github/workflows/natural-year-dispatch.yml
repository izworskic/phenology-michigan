name: Update the natural-year field dispatch

on:
  push:
    branches: [main]
    paths:
      - 'data/signals.json'
      - 'data/phenology-species-trials.json'
      - 'data/natural-year-connections.json'
      - 'scripts/build-natural-year-dispatch.py'
  schedule:
    # Daily after the 13:00 UTC signals refresh; scheduled start times may drift.
    - cron: '45 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: natural-year-home-dispatch
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate observational, seasonal and region gates
        run: python3 -m unittest discover -s scripts -p 'test_natural_year_dispatch.py' -v
      - name: Recompute from existing archive sources only
        run: python3 scripts/build-natural-year-dispatch.py
      - name: Publish truthful dated dispatch without a site rebuild
        run: |
          git config user.name "phenology-natural-year-bot"
          git config user.email "phenology-natural-year-bot@users.noreply.github.com"
          git add data/natural-year-dispatch.json
          if git diff --cached --quiet; then echo "Dispatch already current"; exit 0; fi
          git commit -m "Update Michigan natural-year field dispatch [skip deploy]"
          git pull --rebase origin main
          git push origin HEAD:main
