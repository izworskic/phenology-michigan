name: Archive salamander forecast as issued
on:
  schedule:
    # Twice each Michigan spring afternoon: 2/3 p.m. and 4/5 p.m. (EST/EDT).
    # Second attempt only fills a SAME-DAY missed first capture; never rewrites/backfills.
    - cron: '5 19,21 * 3-5 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: salamander-forecast-issue-daily
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Determine whether a same-day archive attempt is needed
        id: due
        run: node scripts/salamander-archive-window.mjs
      - if: steps.due.outputs.capture_required == 'true'
        run: npm ci
      - if: steps.due.outputs.capture_required == 'true'
        run: npm test
      - name: Capture currently issued spring forecasts only
        if: steps.due.outputs.capture_required == 'true'
        run: node scripts/archive-salamander-forecast.mjs
      - name: Commit immutable-by-day forecast issue archive
        if: steps.due.outputs.capture_required == 'true'
        run: |
          git add data/salamander-forecast-issues.json
          if git diff --cached --quiet; then
            echo "Already archived current Michigan spring date; no forecast rewritten."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze Michigan salamander seven-night forecast before evening"
          git fetch origin main
          git pull --rebase origin main
          npm test
          git push origin HEAD:main
