name: Bloom Energy QA

on:
  push:
    branches:
      - enhance/bloom-energy-surface

jobs:
  verify-energy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          VERCEL_ENV=preview npm start -- -p 3000 > /tmp/bloom-energy.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS 'http://127.0.0.1:3000/bloom-tracker?fixture=strong' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bloom-energy.log
          exit 1
      - name: Compare strong and weak bloom energy
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, hasTouch: true, isMobile: true });
          const errors = [];
          page.on('console', (msg) => { if (msg.type() === 'error') errors.push(msg.text()); });

          async function inspect(fixture, screenshot) {
            await page.goto(`http://127.0.0.1:3000/bloom-tracker?fixture=${fixture}`, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForFunction(() => document.querySelectorAll('.bloom-carto-map .leaflet-tile-loaded').length >= 4, null, { timeout: 20000 });
            await page.waitForFunction(() => document.querySelectorAll('.bloom-map-marker').length === 5, null, { timeout: 15000 });
            await page.locator('.map-section').scrollIntoViewIfNeeded();
            await page.waitForTimeout(400);
            const result = await page.evaluate(() => {
              const pane = document.querySelector('.leaflet-bloomEnergyPane');
              const rings = [...document.querySelectorAll('.bloom-energy-ring')];
              const opacities = rings.map((ring) => Number(getComputedStyle(ring).fillOpacity || ring.getAttribute('fill-opacity') || 0));
              const paneTransform = pane?.closest('.leaflet-map-pane')?.style.transform || '';
              const insight = document.querySelector('.bloom-map-insight-copy')?.textContent || '';
              const tile = document.querySelector('.bloom-carto-map .leaflet-tile-loaded')?.getBoundingClientRect();
              return {
                ringCount: rings.length,
                opacitySum: opacities.reduce((sum, value) => sum + value, 0),
                maxOpacity: Math.max(0, ...opacities),
                paneExists: Boolean(pane),
                paneTransform,
                insight,
                tileSize: tile ? [tile.width, tile.height] : null,
              };
            });
            await page.screenshot({ path: screenshot, fullPage: true });
            return result;
          }

          const strong = await inspect('strong', '/tmp/bloom-energy-strong.png');
          const weak = await inspect('weak', '/tmp/bloom-energy-weak.png');
          if (!strong.paneExists || !weak.paneExists) throw new Error('dedicated bloom energy pane missing');
          if (strong.ringCount < 12) throw new Error(`strong fixture lacks energy surface: ${JSON.stringify(strong)}`);
          if (strong.opacitySum <= weak.opacitySum) throw new Error(`strong bloom should carry more total energy than weak: ${JSON.stringify({strong,weak})}`);
          if (strong.maxOpacity < 0.2) throw new Error(`peak core is not vivid enough: ${JSON.stringify(strong)}`);
          if (!/intensif|saturat|bright/i.test(strong.insight)) throw new Error(`insight does not explain bloom energy: ${strong.insight}`);
          if (!strong.tileSize || Math.abs(strong.tileSize[0] - 256) > 1 || Math.abs(strong.tileSize[1] - 256) > 1) throw new Error(`CARTO tiles distorted: ${JSON.stringify(strong.tileSize)}`);
          if (errors.length) throw new Error(`console errors: ${errors.join(' | ')}`);
          await fs.writeFile('/tmp/bloom-energy-report.json', JSON.stringify({ strong, weak }, null, 2));
          console.log(JSON.stringify({ strong, weak }, null, 2));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-energy-render
          path: |
            /tmp/bloom-energy-strong.png
            /tmp/bloom-energy-weak.png
            /tmp/bloom-energy-report.json
          retention-days: 3
