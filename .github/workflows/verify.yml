name: Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify.yml'
      - 'lib/bloom/**'
      - 'lib/trillium.mjs'
      - 'lib/trillium-local.mjs'
      - 'pages/api/trillium-local.js'
      - 'components/TrilliumLocalConditions.js'
      - 'scripts/check-trillium-local.mjs'
      - 'lib/trillium-history.mjs'
      - 'lib/trillium-thermal.mjs'
      - 'data/trillium-thermal-history.json'
      - 'components/TrilliumThermal.js'
      - 'pages/api/trillium-thermal.js'
      - 'scripts/check-trillium-thermal.mjs'
      - 'scripts/refresh-trillium-thermal.mjs'
      - 'data/trillium-flowering-history.json'
      - 'components/TrilliumHistory.js'
      - 'pages/api/trillium-history.js'
      - 'scripts/check-trillium-history.mjs'
      - 'scripts/refresh-trillium-history.mjs'
      - 'lib/trillium-site-verification.mjs'
      - 'data/trillium-site-reports.json'
      - 'scripts/check-trillium-sites.mjs'
      - 'pages/michigan-trillium.js'
      - 'pages/api/trillium.js'
      - 'public/trillium.css'
      - 'scripts/check-trillium.mjs'
      - 'pages/sitemap.xml.js'
      - 'package.json'
      - 'pages/bloom-tracker.js'
      - 'pages/_app.js'
      - 'pages/firefly-tracker.js'
      - 'components/FireflyCartoMap.js'
      - 'public/firefly-tracker.css'
      - 'lib/fireflies.js'
      - 'lib/hummingbirds.js'
      - 'lib/hummingbird-calibration.js'
      - 'data/hummingbird-history.json'
      - 'scripts/refresh-hummingbird-history.mjs'
      - 'scripts/check-hummingbird-calibration.mjs'
      - 'pages/hummingbird-tracker.js'
      - 'pages/api/hummingbirds.js'
      - 'components/HummingbirdMap.js'
      - 'public/hummingbird-tracker.css'
      - 'scripts/check-hummingbirds.mjs'
      - 'scripts/check-firefly-map.mjs'
      - 'scripts/check-fireflies.mjs'
      - 'pages/api/bloom-*.js'
      - 'public/bloom-*'
      - 'scripts/check-bloom-*.mjs'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
