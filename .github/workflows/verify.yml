name: Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify.yml'
      - 'lib/bloom/**'
      - 'pages/bloom-tracker.js'
      - 'pages/_app.js'
      - 'pages/api/bloom-*.js'
      - 'public/bloom-*'
      - 'scripts/check-bloom-*.mjs'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
