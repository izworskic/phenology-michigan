name: Bloom Tracker Refresh

on:
  schedule:
    # Shoulder month: build early-season history once daily in March.
    - cron: '15 12 * 3 *'
    # Active spring and summer observations; retain four checks/day in Apr–Sep.
    - cron: '15 11,15,19,23 * 4-9 *'
    # Autumn garden and chrysanthemum planning: one daily check in October.
    # Operator event dates alone never become live bloom observations.
    - cron: '15 12 * 10 *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh persistent bloom state
        run: |
          curl -sS -X GET "https://phenology.chrisizworski.com/api/bloom-refresh" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail --max-time 180 -w "\nHTTP %{http_code}\n"
