name: Bloom Persona Red Team

on:
  push:
    branches:
      - "improve/bloom-persona-red-team"

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply persona hardening
        run: python scripts/apply-bloom-persona-pass.py
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start built preview
        run: |
          VERCEL_ENV=preview npm start -- -p 3000 > /tmp/bloom-persona.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS 'http://127.0.0.1:3000/bloom-tracker?fixture=strong' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bloom-persona.log
          exit 1
      - name: Verify personas in browser
        run: node scripts/verify-bloom-persona.mjs
      - name: Commit verified product changes
        run: |
          git config user.name "Chris Izworski"
          git config user.email "46615230+izworskic@users.noreply.github.com"
          git add public/bloom-map-v2.js public/bloom-map-v2.css pages/bloom-tracker.js scripts/check-bloom-map-v2.mjs
          git commit -m "Simplify Bloom Tracker around user decisions"
          git push origin HEAD:improve/bloom-persona-red-team
