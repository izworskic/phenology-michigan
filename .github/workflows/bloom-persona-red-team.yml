name: Bloom Persona Red Team

on:
  push:
    branches:
      - improve/bloom-persona-red-team

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply persona hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          def must_not_contain(path, needle):
              text = Path(path).read_text()
              if needle in text:
                  raise SystemExit(f'{path}: unexpected text remains: {needle!r}')

          # 1) Remove route-like dotted lines. The map should communicate timing/status through
          # markers and intensity, not imply travel routes or measured bloom paths.
          replace_one('public/bloom-map-v2.js', """  function addSeasonSequence(records) {
            const sequence = [...records].sort((a, b) => DESTINATIONS[a.id].order - DESTINATIONS[b.id].order);
            for (let index = 0; index < sequence.length - 1; index += 1) {
              const a = DESTINATIONS[sequence[index].id];
              const b = DESTINATIONS[sequence[index + 1].id];
              window.L.polyline([[a.lat, a.lon], [b.lat, b.lon]], { color: b.seasonColor, weight: 4, opacity: 0.55, dashArray: '7 8', interactive: false }).addTo(map);
            }
          }

""", '')
          replace_one('public/bloom-map-v2.js', """    window.L.polyline(points.map((point) => point.latlng), { pane: 'bloomEnergyPane', color: '#755c68', weight: 2, opacity: 0.24, dashArray: '4 7', interactive: false }).addTo(map);
""", '')
          replace_one('public/bloom-map-v2.js', """    const closest = closestWorthGoing(records);
            if (closest) {
              const destination = DESTINATIONS[closest.id];
              window.L.polyline([[origin.lat, origin.lon], [destination.lat, destination.lon]], { color: '#233bff', weight: 2, opacity: 0.52, dashArray: '6 7', interactive: false }).addTo(map);
            }
""", '')
          replace_one('public/bloom-map-v2.js', """      if (seasonal) addSeasonSequence(records);
              else addBloomIntensitySurface(records);
""", """      if (!seasonal) addBloomIntensitySurface(records);
""")

          # 2) On mobile, nine permanent labels compete with the map. Names remain one tap away
          # in popups; desktop keeps permanent labels.
          replace_one('public/bloom-map-v2.js', """        marker.bindTooltip(tooltipHtml(record, seasonal), { permanent: true, direction: 'top', offset: [0, -13], className: 'bloom-map-tooltip', opacity: 0.95 });
""", """        marker.bindTooltip(tooltipHtml(record, seasonal), { permanent: window.innerWidth > 600, direction: 'top', offset: [0, -13], className: 'bloom-map-tooltip', opacity: 0.95 });
""")

          # 3) Don't expose cosmetic origin controls when seasonal mode cannot make a live trip call.
          replace_one('public/bloom-map-v2.js', """  function upsertControls(section, seasonal) {
            section.querySelector('.bloom-map-decision-controls')?.remove();
            const controls = document.createElement('div');
""", """  function upsertControls(section, seasonal) {
            section.querySelector('.bloom-map-decision-controls')?.remove();
            if (seasonal) return;
            const controls = document.createElement('div');
""")

          # 4) Make the seasonal legend and accessibility language match the actual April–September product.
          replace_one('public/bloom-map-v2.js', """      legend.innerHTML = '<span><i style=\"background:#ff7aa8\"></i>Spring starts</span><span>→</span><span><i style=\"background:#e6a52d\"></i>Late summer</span>';
""", """      legend.innerHTML = '<span><i style=\"background:#ff7aa8\"></i>April</span><span>→</span><span><i style=\"background:#e6a52d\"></i>September</span>';
""")
          replace_one('public/bloom-map-v2.js', """      mapHost.setAttribute('aria-label', seasonal ? 'Interactive CARTO map showing the typical tracked Michigan bloom sequence' : `Interactive CARTO map showing Michigan tracked bloom intensity: ${activeView}`);
""", """      mapHost.setAttribute('aria-label', seasonal ? 'Interactive CARTO map showing typical Michigan flower-season timing from April into September' : `Interactive CARTO map showing Michigan tracked bloom intensity: ${activeView}`);
""")

          # Static fallback: remove the Traverse dotted connector too. Zone points retain the useful detail.
          replace_one('pages/bloom-tracker.js', """  const wavePath = useMemo(() => {
            if (!waveEntry) return '';
            return waveEntry.zoneStatus.map((zone, index) => {
              const [x, y] = projectCoordinate(zone.coordinates.lon, zone.coordinates.lat);
              return `${index === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(' ');
          }, [waveEntry]);

""", '')
          replace_one('pages/bloom-tracker.js', """                <path d={wavePath} fill=\"none\" stroke=\"#53695a\" strokeWidth=\"4\" strokeDasharray=\"9 8\" opacity=\"0.65\" vectorEffect=\"non-scaling-stroke\" />
""", '')

          # Product language: this is now an April–September flower-season product, not April–June spring-only.
          replace_one('pages/bloom-tracker.js', """    <section className=\"season-route\" aria-label=\"Typical Michigan spring bloom sequence\">
              <div className=\"season-route-label\">Typical spring sequence <span>planning context, not live bloom</span></div>
""", """    <section className=\"season-route\" aria-label=\"Typical Michigan flower-season sequence\">
              <div className=\"season-route-label\">Typical flower-season sequence <span>planning context, not live bloom</span></div>
""")
          replace_one('pages/bloom-tracker.js', """          <svg className=\"census-map\" viewBox={`0 0 ${MAP.width} ${MAP.height}`} role=\"img\" aria-label={seasonalMode ? 'Michigan bloom destinations labeled by typical spring timing' : 'Michigan and neighboring states with current bloom destinations'}>
""", """          <svg className=\"census-map\" viewBox={`0 0 ${MAP.width} ${MAP.height}`} role=\"img\" aria-label={seasonalMode ? 'Michigan flower destinations labeled by typical April-to-September timing' : 'Michigan and neighboring states with current bloom destinations'}>
""")
          replace_one('pages/bloom-tracker.js', """        <title>Michigan Bloom Tracker — Blooms Now & Spring Timing</title>
              <meta name=\"description\" content=\"Track Michigan spring blooms from April through June: Holland tulips, Traverse City cherry blossoms, U-M peonies, Meijer Gardens cherries and Mackinac lilacs, with live trip calls in season and clear off-season timing.\" />
""", """        <title>Michigan Bloom Tracker — What’s Blooming & When to Go</title>
              <meta name=\"description\" content=\"Track Michigan flower season from April into September: cherries, tulips, peonies, lilacs, lavender and major sunflower fields, with live trip calls, weekend outlooks and clear seasonal timing.\" />
""")
          replace_one('pages/bloom-tracker.js', """        <meta property=\"og:title\" content=\"Michigan Bloom Tracker — Blooms Now & Spring Timing\" />
              <meta property=\"og:description\" content=\"See where Michigan spring is in the bloom season, what is worth the drive when flowers are active, and how the season moves from April into June.\" />
""", """        <meta property=\"og:title\" content=\"Michigan Bloom Tracker — What’s Blooming & When to Go\" />
              <meta property=\"og:description\" content=\"See which tracked Michigan flower display is strongest now, what is worth the drive, and how the season moves from April cherries and tulips into September sunflowers.\" />
""")
          replace_one('pages/bloom-tracker.js', """          <p>Follow Michigan spring from the first garden color through orchard bloom, peonies and island lilacs. In season, fresh evidence turns that progression into a trip decision.</p>
""", """          <p>Follow Michigan’s flower season from April cherries and tulips through summer lavender and sunflower fields into September. Fresh evidence turns that progression into a trip decision.</p>
""")
          replace_one('pages/bloom-tracker.js', """              <div className=\"section-heading\"><div><span className=\"eyebrow\">{seasonalMode ? 'Michigan spring, place by place' : 'Statewide opportunity desk'}</span><h2 id=\"where-title\">{seasonalMode ? 'What does each stop feel like?' : 'Where should I go?'}</h2></div><span className=\"count\">{destinations.length} tracked displays</span></div>
              <p className=\"opportunity-intro\">{seasonalMode ? 'The season has a geography as well as a calendar. These are the places the tracker will wake up in, in roughly the order spring tends to reach their main display.' : 'The live decision stays primary. Each place gets just enough visual context to show what you are driving toward; expand only the destinations you care about.'}</p>
""", """              <div className=\"section-heading\"><div><span className=\"eyebrow\">{seasonalMode ? 'Michigan flower season, place by place' : 'Statewide opportunity desk'}</span><h2 id=\"where-title\">{seasonalMode ? 'What does each stop feel like?' : 'Where should I go?'}</h2></div><span className=\"count\">{destinations.length} tracked displays</span></div>
              <p className=\"opportunity-intro\">{seasonalMode ? 'The season has a geography as well as a calendar. These are the places the tracker wakes up in from April into September, ordered by their broad planning windows.' : 'The live decision stays primary. Each place gets just enough visual context to show what you are driving toward; expand only the destinations you care about.'}</p>
""")
          replace_one('pages/bloom-tracker.js', """            <section className=\"trust-block\"><div className=\"trust-icon\"><ShieldCheck size={21} /></div><div><h2>{seasonalMode ? 'Why the calendar never becomes a bloom claim' : 'Why the tracker can say “not enough evidence”'}</h2><p>{seasonalMode ? 'The April-to-June sequence is a planning frame built from destination guidance and normal seasonal order. It helps explain where spring goes next, but only fresh observations can switch a destination into GO, WAIT, GO_BEFORE or LIMITED. File photos are never treated as current evidence.' : 'Observations anchor the forecast. Weather can change development or shorten a display, but it cannot create bloom that has not been observed. Stale observations lower confidence, abnormal-year evidence overrides normal timing, and long-range output stays a range rather than a fake peak date.'}</p></div></section>
""", """            <section className=\"trust-block\"><div className=\"trust-icon\"><ShieldCheck size={21} /></div><div><h2>{seasonalMode ? 'Why the calendar never becomes a bloom claim' : 'Why the tracker can say “not enough evidence”'}</h2><p>{seasonalMode ? 'The April-to-September sequence is a planning frame built from destination guidance and broad seasonal order. It helps explain what tends to come next, but only fresh observations can switch a destination into GO, WAIT, GO_BEFORE or LIMITED. File photos are never treated as current evidence.' : 'Observations anchor the forecast. Weather can change development or shorten a display, but it cannot create bloom that has not been observed. Stale observations lower confidence, abnormal-year evidence overrides normal timing, and long-range output stays a range rather than a fake peak date.'}</p></div></section>
""")
          replace_one('pages/bloom-tracker.js', """          <span><b>June</b> Mackinac lilacs</span>
              </div>
""", """          <span><b>June</b> Mackinac lilacs</span>
                  <span><b>Late June–August</b> Milan lavender</span>
                  <span><b>Late July–August</b> Frankenmuth + Gull Meadow sunflowers</span>
                  <span><b>Late August–September</b> Blake’s sunflowers</span>
              </div>
""")

          # CSS should no longer hide route lines that the renderer should not create in the first place.
          replace_one('public/bloom-map-v2.css', ".bloom-carto-map path[stroke-dasharray=\"7 8\"],.bloom-carto-map path[stroke-dasharray=\"7, 8\"],.bloom-carto-map path[stroke-dasharray=\"4 7\"],.bloom-carto-map path[stroke-dasharray=\"4, 7\"]{display:none!important}\n\n", '')

          # Regression coverage for the persona pass.
          p = Path('scripts/check-bloom-map-v2.mjs')
          text = p.read_text()
          text = text.replace("const originApi = await fs.readFile(new URL('../pages/api/bloom-origin.js', import.meta.url), 'utf8');\n", "const originApi = await fs.readFile(new URL('../pages/api/bloom-origin.js', import.meta.url), 'utf8');\nconst page = await fs.readFile(new URL('../pages/bloom-tracker.js', import.meta.url), 'utf8');\n")
          text = text.replace("assert.ok(enhancer.includes('Spring starts') && enhancer.includes('Late summer'), 'seasonal legend must communicate the expanded spring-to-late-summer arc');", "assert.ok(enhancer.includes('>April</span>') && enhancer.includes('>September</span>'), 'seasonal legend must communicate the April-to-September arc');")
          anchor = "assert.ok(enhancer.includes('HAS_FIXTURE'), 'preview fixtures must remain deterministic and not be overwritten by production live data');\n"
          insertion = """assert.ok(!enhancer.includes('addSeasonSequence'), 'seasonal destinations must not be connected by route-like lines');
          assert.ok(!enhancer.includes('dashArray:'), 'map renderer must not create dotted route/progression lines');
          assert.ok(enhancer.includes('permanent: window.innerWidth > 600'), 'mobile map must not render nine permanent destination labels');
          assert.ok(enhancer.includes("if (seasonal) return;"), 'off-season map must not expose non-causal origin controls');
          """
          if anchor not in text:
              raise SystemExit('test anchor missing')
          text = text.replace(anchor, anchor + insertion, 1)
          anchor2 = "assert.ok(css.includes('.bloom-carto-map .leaflet-tile{width:256px!important;height:256px!important}'), 'CARTO raster tiles must retain native Leaflet dimensions during pan and zoom');\n"
          insertion2 = """assert.ok(!css.includes('stroke-dasharray'), 'CSS must not rely on hiding dotted lines after they are rendered');
          assert.ok(!page.includes('strokeDasharray'), 'static fallback must not draw route-like dotted lines');
          assert.ok(page.includes('April-to-September sequence'), 'trust copy must describe the full tracked season');
          assert.ok(page.includes('summer lavender and sunflower fields into September'), 'intro must explain the extended flower season');
          assert.ok(page.includes('Michigan Bloom Tracker — What’s Blooming & When to Go'), 'metadata must describe the decision product instead of spring-only timing');
          assert.ok(!page.includes('Track Michigan spring blooms from April through June'), 'spring-only metadata must not survive the summer expansion');
          """
          if anchor2 not in text:
              raise SystemExit('test anchor2 missing')
          text = text.replace(anchor2, anchor2 + insertion2, 1)
          p.write_text(text)

          must_not_contain('public/bloom-map-v2.js', 'dashArray:')
          must_not_contain('pages/bloom-tracker.js', 'strokeDasharray')
          PY

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Start built preview
        run: |
          VERCEL_ENV=preview npm start -- -p 3000 > /tmp/bloom-persona.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS 'http://127.0.0.1:3000/bloom-tracker?fixture=strong' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bloom-persona.log
          exit 1

      - name: Verify persona behavior at 390px and desktop
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, hasTouch: true, isMobile: true });
          const errors = [];
          mobile.on('console', (msg) => { if (msg.type() === 'error') errors.push(msg.text()); });
          await mobile.goto('http://127.0.0.1:3000/bloom-tracker?fixture=strong', { waitUntil: 'networkidle', timeout: 60000 });
          await mobile.waitForFunction(() => document.querySelectorAll('.bloom-map-marker').length >= 5, null, { timeout: 15000 });
          if (await mobile.locator('.bloom-map-tooltip').count() !== 0) throw new Error('mobile still has permanent destination labels');
          if (await mobile.locator('.bloom-carto-map path[stroke-dasharray]').count() !== 0) throw new Error('dotted map paths still render on mobile');
          if (await mobile.locator('.bloom-map-decision-controls').count() !== 1) throw new Error('live mobile decision controls missing');
          if ((await mobile.locator('body').innerText()).includes('April through June')) throw new Error('spring-only product copy still visible');
          await mobile.screenshot({ path: '/tmp/bloom-persona-mobile.png', fullPage: true });

          const desktop = await browser.newPage({ viewport: { width: 1100, height: 900 } });
          await desktop.goto('http://127.0.0.1:3000/bloom-tracker?fixture=strong', { waitUntil: 'networkidle', timeout: 60000 });
          await desktop.waitForFunction(() => document.querySelectorAll('.bloom-map-marker').length >= 5, null, { timeout: 15000 });
          if (await desktop.locator('.bloom-map-tooltip').count() < 5) throw new Error('desktop lost useful permanent destination labels');
          if (await desktop.locator('.bloom-carto-map path[stroke-dasharray]').count() !== 0) throw new Error('dotted map paths still render on desktop');
          await desktop.screenshot({ path: '/tmp/bloom-persona-desktop.png', fullPage: true });

          if (errors.length) throw new Error(`browser console errors: ${errors.join(' | ')}`);
          await browser.close();
          NODE

      - name: Commit persona pass
        run: |
          git config user.name "Chris Izworski"
          git config user.email "46615230+izworskic@users.noreply.github.com"
          git add public/bloom-map-v2.js public/bloom-map-v2.css pages/bloom-tracker.js scripts/check-bloom-map-v2.mjs
          git commit -m "Simplify Bloom Tracker around user decisions"
          git push origin HEAD:improve/bloom-persona-red-team
