name: Bloom OIDC Lockfile

on:
  push:
    branches:
      - enhance/bloom-seasonal-editorial-map

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[oidc-lock]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhance/bloom-seasonal-editorial-map
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate exact OIDC dependency lock
        run: npm install @vercel/oidc@3.8.8 --save-exact --package-lock-only --ignore-scripts
      - name: Commit generated package metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No lockfile changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Add Vercel OIDC runtime dependency [oidc-lock]'
          git push origin HEAD:enhance/bloom-seasonal-editorial-map
