name: Bloom Decision Map QA

on:
  push:
    branches:
      - enhance/bloom-time-origin-trust

jobs:
  verify-decision-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start preview server
        run: |
          VERCEL_ENV=preview npm start -- -p 3000 > /tmp/bloom-decision.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS 'http://127.0.0.1:3000/bloom-tracker?fixture=strong' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bloom-decision.log
          exit 1
      - name: Verify current, controls, trust, and origin behavior
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, hasTouch: true, isMobile: true });
          const errors = [];
          page.on('console', (msg) => { if (msg.type() === 'error') errors.push(msg.text()); });

          async function loadFixture(name) {
            await page.goto(`http://127.0.0.1:3000/bloom-tracker?fixture=${name}`, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForFunction(() => document.querySelectorAll('.bloom-carto-map .leaflet-tile-loaded').length >= 4, null, { timeout: 20000 });
            await page.waitForFunction(() => document.querySelectorAll('.bloom-map-marker').length === 5, null, { timeout: 15000 });
            await page.locator('.map-section').scrollIntoViewIfNeeded();
            await page.waitForTimeout(300);
          }
          async function state() {
            return page.evaluate(() => {
              const rings = [...document.querySelectorAll('.bloom-energy-ring')];
              const opacities = rings.map((ring) => Number(getComputedStyle(ring).fillOpacity || ring.getAttribute('fill-opacity') || 0));
              const body = document.body.getBoundingClientRect();
              return {
                headline: document.querySelector('.bloom-map-insight-copy strong')?.textContent || '',
                detail: document.querySelector('.bloom-map-insight-copy span')?.textContent || '',
                ringCount: rings.length,
                opacitySum: opacities.reduce((sum, value) => sum + value, 0),
                maxOpacity: Math.max(0, ...opacities),
                tabs: [...document.querySelectorAll('.bloom-time-tab')].map((b) => b.textContent),
                selectedTab: document.querySelector('.bloom-time-tab[aria-pressed="true"]')?.textContent || '',
                overflow: Math.max(0, body.width - window.innerWidth, document.documentElement.scrollWidth - window.innerWidth),
                sourceText: document.querySelector('.map-source')?.textContent || '',
              };
            });
          }

          await loadFixture('strong');
          const now = await state();
          if (JSON.stringify(now.tabs) !== JSON.stringify(['Now','This weekend','What’s next'])) throw new Error(`time tabs wrong: ${JSON.stringify(now.tabs)}`);
          if (!/strongest display we.re tracking right now/i.test(now.headline)) throw new Error(`tracked-only now claim missing: ${now.headline}`);
          if (/Michigan is brightest/i.test(now.headline)) throw new Error(`unsupported statewide claim survived: ${now.headline}`);
          if (!/confidence, freshness and forecast uncertainty/i.test(now.sourceText)) throw new Error(`trust explanation missing: ${now.sourceText}`);
          if (now.ringCount < 24 || now.maxOpacity <= 0.05) throw new Error(`strong fixture lacks a visible current intensity surface: ${JSON.stringify(now)}`);
          if (now.overflow > 2) throw new Error(`mobile overflow in now view: ${now.overflow}`);
          await page.screenshot({ path: '/tmp/bloom-now.png', fullPage: true });

          const hollandMarker = page.locator('.leaflet-marker-icon[title^="Holland Tulips"]').first();
          await hollandMarker.click();
          const hollandLink = page.locator('.leaflet-popup a.bloom-source-link');
          await hollandLink.waitFor({ timeout: 5000 });
          const hollandHref = await hollandLink.getAttribute('href');
          if (!hollandHref?.includes('cityofholland.com/1022/Tulip-Tracker')) throw new Error(`Holland official tracker missing: ${hollandHref}`);
          if (!/live tracker \+ cameras/i.test(await hollandLink.textContent())) throw new Error('Holland camera wording missing');
          await page.keyboard.press('Escape').catch(() => {});

          // SSR fixtures intentionally omit the live client forecast payload. The browser must fail closed,
          // while static regression tests cover projection against the real decision.forecast contract.
          await page.getByRole('button', { name: 'This weekend' }).click();
          await page.waitForTimeout(350);
          const weekend = await state();
          if (weekend.selectedTab !== 'This weekend') throw new Error(`weekend tab not selected: ${weekend.selectedTab}`);
          if (!/forecast is not strong enough/i.test(weekend.headline)) throw new Error(`fixture future view did not fail closed: ${weekend.headline}`);
          if (weekend.opacitySum !== 0) throw new Error(`fixture future view invented intensity without forecast payload: ${weekend.opacitySum}`);
          await page.screenshot({ path: '/tmp/bloom-weekend.png', fullPage: true });

          await page.getByRole('button', { name: 'What’s next' }).click();
          await page.waitForTimeout(350);
          const next = await state();
          if (next.selectedTab !== 'What’s next') throw new Error(`next tab not selected: ${next.selectedTab}`);
          if (!/forecast is not strong enough/i.test(next.headline)) throw new Error(`fixture next view did not fail closed: ${next.headline}`);
          if (next.opacitySum !== 0) throw new Error(`fixture next view invented intensity without forecast payload: ${next.opacitySum}`);
          await page.screenshot({ path: '/tmp/bloom-next.png', fullPage: true });

          await page.getByRole('button', { name: 'Now' }).click();
          await page.getByLabel('Starting city or ZIP').fill('Bay City');
          await page.getByRole('button', { name: 'Set' }).click();
          await page.waitForFunction(() => /Starting point: Bay City, MI/i.test(document.querySelector('.bloom-origin-status')?.textContent || ''), null, { timeout: 15000 });
          await page.waitForFunction(() => /from Bay City, MI/i.test(document.querySelector('.bloom-map-insight-copy strong')?.textContent || ''), null, { timeout: 10000 });
          const fromMe = await state();
          if (await page.locator('.bloom-origin-marker').count() !== 1) throw new Error('origin marker missing');
          if (!/Road distance will be longer/i.test(fromMe.detail)) throw new Error(`distance honesty missing: ${fromMe.detail}`);
          await page.locator('.leaflet-marker-icon[title^="Holland Tulips"]').first().click();
          if (await page.locator('.leaflet-popup a.bloom-directions-link').count() < 1) throw new Error('exact directions link missing after origin selection');
          await page.screenshot({ path: '/tmp/bloom-from-me.png', fullPage: true });

          await loadFixture('weak');
          const weak = await state();
          if (weak.opacitySum >= now.opacitySum * 0.6) throw new Error(`weak/stale intensity remains too strong: ${JSON.stringify({now,weak})}`);
          if (weak.overflow > 2) throw new Error(`mobile overflow in weak view: ${weak.overflow}`);
          if (errors.length) throw new Error(`browser console errors: ${errors.join(' | ')}`);

          await fs.writeFile('/tmp/bloom-decision-report.json', JSON.stringify({ now, weekend, next, fromMe, weak }, null, 2));
          console.log(JSON.stringify({ now, weekend, next, fromMe, weak }, null, 2));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-decision-map-render
          path: |
            /tmp/bloom-now.png
            /tmp/bloom-weekend.png
            /tmp/bloom-next.png
            /tmp/bloom-from-me.png
            /tmp/bloom-decision-report.json
          retention-days: 3
