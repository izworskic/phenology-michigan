name: Backfill Trillium Thermal History
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trillium-thermal-bootstrap.yml'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trillium-thermal-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Populate reproducible 2019-2026 ERA5 spring archive
        run: node scripts/refresh-trillium-thermal.mjs
      - name: Save real source archive
        run: |
          git add data/trillium-thermal-history.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Backfill 2019-2026 regional trillium thermal history (ERA5)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
